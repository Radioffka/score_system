<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bodík: Tomáškův Bodovací Systém</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            keyframes: {
              pointPulsePositive: {
                '0%, 100%': { transform: 'scale(1)', color: 'white' },
                '50%': { transform: 'scale(1.15)', color: '#2dd4bf' }, // teal-400
              },
              pointPulseNegative: {
                '0%, 100%': { transform: 'scale(1)', color: 'white' },
                '50%': { transform: 'scale(1.15)', color: '#f87171' }, // red-400
              }
            },
            animation: {
              pointPulsePositive: 'pointPulsePositive 0.6s ease-in-out',
              pointPulseNegative: 'pointPulseNegative 0.6s ease-in-out',
            }
          },
        },
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "vite": "https://aistudiocdn.com/vite@^7.1.12",

    "home-assistant-js-websocket": "https://aistudiocdn.com/home-assistant-js-websocket@^9.5.0"
  }
}
</script>
</head>
  <body class="bg-gray-900 text-gray-200 font-sans">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
