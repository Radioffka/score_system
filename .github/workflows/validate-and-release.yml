name: Validate and release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  release:
    name: Publish version
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs:
      - validate-hacs
      - validate-hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify version consistency
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path("custom_components/bodik")
          manifest_version = json.loads(
              (root / "manifest.json").read_text(encoding="utf-8")
          )["version"]
          const_version = re.search(
              r'^VERSION = "([^"]+)"$',
              (root / "const.py").read_text(encoding="utf-8"),
              re.MULTILINE,
          ).group(1)
          frontend_version = re.search(
              r'^const VERSION = "([^"]+)";$',
              (root / "bodik-panel.js").read_text(encoding="utf-8"),
              re.MULTILINE,
          ).group(1)
          versions = {manifest_version, const_version, frontend_version}
          if len(versions) != 1:
              raise SystemExit(f"Version mismatch: {sorted(versions)}")
          pathlib.Path("release-version.txt").write_text(
              manifest_version, encoding="utf-8"
          )
          PY

      - name: Create release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat release-version.txt)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Bodík $tag" \
              --generate-notes
          fi
